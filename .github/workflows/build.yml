name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          mkdir -p project
          unzip -q -o ./*.zip -d project
          find project -maxdepth 4 | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorningBrief-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Morning Brief (latest build)
          files: project/app/build/outputs/apk/debug/app-debug.apk
